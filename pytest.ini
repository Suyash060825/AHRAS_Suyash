[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    # Filter upstream third-party numpy 2.5 deprecation warning emitted by joblib.numpy_pickle
    ignore:Setting the shape on a NumPy array has been deprecated in NumPy 2.5.*:DeprecationWarning:joblib.numpy_pickle
