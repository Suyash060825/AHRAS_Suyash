apiVersion: apps/v1
kind: Deployment
metadata:
  name: ahras-soc-pipeline
  namespace: ahras
  labels:
    app: ahras
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ahras
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ahras
    spec:
      containers:
      - name: ahras-api
        image: ahras/ahras-core:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: ahras-config
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
