version: '3.8'

services:
  # ── AHRAS Core SOC API Service ───────────────────────────────────────────────
  ahras-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ahras_soc_api
    ports:
      - "${AHRAS_PORT:-8000}:8000"
    environment:
      - AHRAS_ENV=${AHRAS_ENV:-PRODUCTION}
      - AHRAS_DEV_MODE=${AHRAS_DEV_MODE:-false}
      - AHRAS_SECRET_KEY=${AHRAS_SECRET_KEY}
      - AHRAS_MODEL_DIR=/app/ahras/detection/models
      - AHRAS_ALLOWED_ORIGINS=${AHRAS_ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      - MONGO_URI=mongodb://mongodb:27017
      - KAFKA_BOOTSTRAP=kafka:9092
    volumes:
      - ./ahras/logs:/app/ahras/logs
      - ./ahras/detection/models:/app/ahras/detection/models
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Production Storage: MongoDB ─────────────────────────────────────────────
  mongodb:
    image: mongo:6.0
    container_name: ahras_mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=ahras
    volumes:
      - mongo_data:/data/db
    profiles:
      - prod

  # ── Production Message Bus: Kafka & Zookeeper ──────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: ahras_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    profiles:
      - prod

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: ahras_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    profiles:
      - prod

volumes:
  mongo_data:
