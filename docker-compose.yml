version: '3.8'

services:
  ahras-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ahras_soc_api
    restart: unless-stopped
    environment:
      - AHRAS_ENV=DEV
      - AHRAS_HOST=0.0.0.0
      - AHRAS_PORT=8000
      - AHRAS_RESPONSE_MODE=DRY_RUN
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # In production, terminate TLS via reverse proxy (e.g. Nginx or Traefik)
  # reverse-proxy:
  #   image: nginx:alpine
  #   ports:
  #     - "443:443"
  #   volumes:
  #     - ./certs:/etc/nginx/certs:ro
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - ahras-api
