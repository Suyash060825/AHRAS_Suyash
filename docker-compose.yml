version: '3.8'

services:
  ahras-engine:
    build: .
    container_name: ahras_production
    env_file:
      - .env
    volumes:
      # Mount the local directory to allow rapid development without rebuilding
      - .:/app
    # If the app exposes a REST API in the future, map the ports:
    ports:
      - "8000:8000"
